<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Venta registrada — Innovacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15211B}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:8px;border:1px solid #C9D2CB;background:#fff;color:#15211B;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn.primary{background:#125D40;border-color:#125D40;color:#fff}
kbd{font-family:inherit;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:1px 6px}
</style>
</head>
<body>

<div style="width: 640px; height: 640px; box-sizing: border-box; background: #8E9891; display: flex; align-items: center; justify-content: center; padding: 32px">
<div role="dialog" aria-modal="true" aria-labelledby="d-t" style="width: 440px; box-sizing: border-box; background: #FFFFFF; border-radius: 14px; box-shadow: 0 16px 48px rgba(21,33,27,.3); padding: 28px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #E3EFE7; color: #125D40; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 28px; height: 28px"><path d="M5 12l5 5 9-10"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="d-t" style="font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 700; margin: 0">Venta #1044 registrada</h2>
<span style="font-size: 14px; color: #56635B">Francisco Castañón · Reynosa · total $8,577.00</span>
</div>
<div style="width: 100%; padding: 16px; border-radius: 12px; background: #F1F7F3; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #3F4B44">Entrega de cambio</span>
<span class="num" style="font-family: Montserrat, sans-serif; font-size: 40px; font-weight: 700; color: #125D40">$423.00</span>
</div>
<a class="btn primary" href="Ticket.html" style="width: 100%; min-height: 52px; font-size: 16px">Imprimir ticket <kbd>Enter</kbd></a>
<div style="display: flex; gap: 8px; width: 100%">
<a class="btn" href="Ticket.html" style="flex: 1 1 0">Nota de venta</a>
<a class="btn" href="Main.html" style="flex: 1 1 0">Nueva venta</a>
</div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajuste por conteo — Innovacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15211B}
.num{font-variant-numeric:tabular-nums}
input,button,select,textarea{font:inherit}
label{font-size:13px;font-weight:600;color:#3F4B44}
.field{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #C9D2CB;border-radius:8px;padding:10px 12px;background:#fff;color:#15211B;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #C9D2CB;background:#fff;color:#15211B;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.primary{background:#125D40;border-color:#125D40;color:#fff}
.x{width:40px;height:40px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3F4B44}
.box{flex:1 1 0;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:#F7F9F7;text-align:center}
</style>
</head>
<body>

<div style="width: 640px; height: 720px; box-sizing: border-box; background: #8E9891; display: flex; align-items: center; justify-content: center; padding: 32px">
<div role="dialog" aria-modal="true" aria-labelledby="d-t" style="width: 500px; box-sizing: border-box; background: #FFFFFF; border-radius: 14px; box-shadow: 0 16px 48px rgba(21,33,27,.3); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="d-t" style="font-family: Montserrat, sans-serif; font-size: 20px; font-weight: 700; margin: 0">Ajuste por conteo</h2>
<span style="font-size: 14px; color: #56635B">Ultra Nitrógeno 20 L · Mostrador Innovacer</span>
</div>
<a class="x" href="Kardex.html" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; gap: 10px; align-items: stretch">
<div class="box"><span style="font-size: 13px; color: #56635B">El sistema dice</span><span class="num" style="font-family: Montserrat, sans-serif; font-size: 28px; font-weight: 700">12</span></div>
<div class="box" style="background: #FFFFFF; border: 2px solid #125D40"><label for="aj-c" style="font-weight: 400; color: #56635B">Contaste</label><input id="aj-c" class="num" value="10" style="border: 0; text-align: center; font-family: Montserrat, sans-serif; font-size: 28px; font-weight: 700; width: 100%; background: none; color: #15211B"></div>
<div class="box" style="background: #FBE4E1"><span style="font-size: 13px; color: #7E2318">Diferencia</span><span class="num" style="font-family: Montserrat, sans-serif; font-size: 28px; font-weight: 700; color: #9B2C1F">−2</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="aj-m">Motivo</label><select id="aj-m" class="field"><option>Faltante sin explicar</option><option>Merma o producto dañado</option><option>Error de captura anterior</option><option>Sobrante</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="aj-n">Nota</label><textarea id="aj-n" class="field" rows="2" style="resize: vertical" placeholder="Qué crees que pasó"></textarea></div>
<span style="font-size: 13px; color: #56635B">Quedará en el kardex como ajuste, con tu usuario y la hora. No se puede borrar, solo corregir con otro ajuste.</span>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<a class="btn" href="Kardex.html">Cancelar</a>
<a class="btn primary" href="Kardex.html">Registrar ajuste</a>
</div>
</div>
</div>
</body>
</html>

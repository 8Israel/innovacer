<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi cuenta — Innovacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15211B}
input,button{font:inherit}
label{font-size:13px;font-weight:600;color:#3F4B44}
.field{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #C9D2CB;border-radius:8px;padding:10px 12px;background:#fff;color:#15211B;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #C9D2CB;background:#fff;color:#15211B;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn.primary{background:#125D40;border-color:#125D40;color:#fff}
.x{width:40px;height:40px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3F4B44}
.f{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>

<div style="width: 640px; height: 680px; box-sizing: border-box; background: #8E9891; display: flex; align-items: center; justify-content: center; padding: 32px">
<div role="dialog" aria-modal="true" aria-labelledby="d-t" style="width: 460px; box-sizing: border-box; background: #FFFFFF; border-radius: 14px; box-shadow: 0 16px 48px rgba(21,33,27,.3); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="d-t" style="font-family: Montserrat, sans-serif; font-size: 20px; font-weight: 700; margin: 0">Mi cuenta</h2>
<span style="font-size: 14px; color: #56635B">[Nombre de la encargada] · usuario: encargada · rol Encargada</span>
</div>
<a class="x" href="Main.html" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div class="f"><label for="mc-a">Contraseña actual</label><input id="mc-a" class="field" type="password" autocomplete="current-password"></div>
<div class="f"><label for="mc-n">Nueva contraseña</label><input id="mc-n" class="field" type="password" autocomplete="new-password"><span style="font-size: 13px; color: #56635B">Mínimo 8 caracteres</span></div>
<div class="f"><label for="mc-c">Repite la nueva contraseña</label><input id="mc-c" class="field" type="password" autocomplete="new-password"></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<a href="Login.html" style="font-size: 14px; font-weight: 600; color: #9B2C1F">Cerrar sesión</a>
<a class="btn primary" href="Main.html">Cambiar contraseña</a>
</div>
</div>
</div>
</body>
</html>
